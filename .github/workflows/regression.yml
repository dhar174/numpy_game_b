name: Regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:regression
        env:
          NEBULA_BROWSER: all
          NEBULA_SHOTS: output/regression
      - name: Smoke-test the development server
        run: node scripts/boot-playtest.mjs --dev
      - name: Preserve verified static game
        uses: actions/upload-artifact@v4
        with:
          name: numpy-nebula-static-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve playtest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numpy-nebula-playtest
          path: output/regression/
          if-no-files-found: ignore
